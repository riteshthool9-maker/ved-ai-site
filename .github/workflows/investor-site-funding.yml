name: Ved Investor Site Funding Check

on:
  pull_request:
    paths:
      - index.html
      - tests/test_investment_amount.py
      - .github/workflows/investor-site-funding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investor-content:
    name: Verify ₹2 crore investor request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout site source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check funding amount and site links
        run: python -B -m unittest discover -s tests -v
